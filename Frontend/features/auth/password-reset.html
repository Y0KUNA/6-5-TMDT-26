<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Đặt lại mật khẩu</title>
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body>
  <div id="siteHeader"></div>
  <div class="container mt-32" style="display:flex; justify-content:center;">
    <div class="card" style="max-width:520px; width:100%;">
      <div class="card-header">
        <h2 class="card-title">Đặt lại mật khẩu</h2>
        <p class="card-subtitle">Nhập mật khẩu mới cho tài khoản của bạn</p>
      </div>
      <form id="resetForm">
        <div class="form-group">
          <label class="form-label">Mật khẩu mới</label>
          <input type="password" id="password" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label">Nhập lại mật khẩu</label>
          <input type="password" id="password2" class="form-input" required />
        </div>
        <div id="msg" style="color:#0f172a; margin-bottom:12px;"></div>
        <button class="btn btn-success" type="submit">Đặt lại mật khẩu</button>
      </form>
    </div>
  </div>

  <script src="../shared/data.js"></script>
  <script src="../shared/header.js"></script>
  <script src="./password-reset.js"></script>
</body>
</html>
