<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Theo dõi đơn hàng - Nông Sản Sạch</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .track-timeline {
      position: relative;
      padding: 20px 0;
    }

    .timeline-item {
      display: flex;
      gap: 20px;
      margin-bottom: 30px;
      position: relative;
    }

    .timeline-marker {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #666;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
      font-size: 20px;
    }

    .timeline-marker.completed {
      background: #10b981;
      color: white;
    }

    .timeline-marker.current {
      background: #f59e0b;
      color: white;
      box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.1);
    }

    .timeline-line {
      position: absolute;
      left: 19px;
      top: 40px;
      width: 2px;
      height: calc(100% + 10px);
      background: #e5e7eb;
      z-index: 1;
    }

    .timeline-item:last-child .timeline-line {
      display: none;
    }

    .timeline-content {
      flex: 1;
      padding-top: 8px;
    }

    .timeline-title {
      font-weight: bold;
      font-size: 16px;
      color: #333;
      margin-bottom: 4px;
    }

    .timeline-time {
      font-size: 14px;
      color: #999;
      margin-bottom: 8px;
    }

    .timeline-description {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <!-- Shared Header -->
  <div id="siteHeader"></div>

  <!-- Main Header -->
  <div class="main-header">
    <a href="../home/index.html" class="logo">
      <div class="logo-icon">🌱</div>
      <div class="logo-text">
        <h1>Nông Sản Sạch</h1>
        <p>Organic Marketplace</p>
      </div>
    </a>
  </div>

  <!-- Main Content -->
  <div class="container" style="padding: 32px 0;">
    <div style="background: white; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
      
      <div class="section-header" style="border-bottom: none; margin-bottom: 24px;">
        <h1 class="section-title">📍 Theo dõi đơn hàng</h1>
        <p style="margin-top: 8px; color: #666; font-size: 14px;">Nhập mã đơn hàng để theo dõi lộ trình giao hàng</p>
      </div>

      <!-- Order ID Input -->
      <div style="display: flex; gap: 12px; margin-bottom: 32px; align-items: center;">
        <input type="text" id="orderIdInput" placeholder="Nhập mã đơn hàng (VD: 123)" style="flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px;">
        <button onclick="trackOrder()" style="padding: 12px 24px; background: #16A34A; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
          Theo dõi
        </button>
      </div>

      <!-- Track Info -->
      <div id="trackInfo" style="display: none;">
        
        <!-- Order Header -->
        <div style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 24px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
            <div>
              <div style="color: #666; font-size: 12px; margin-bottom: 4px;">Mã đơn hàng</div>
              <div id="trackOrderId" style="font-size: 18px; font-weight: bold; color: #333;"></div>
            </div>
            <div>
              <div style="color: #666; font-size: 12px; margin-bottom: 4px;">Trạng thái</div>
              <div id="trackStatus" style="font-size: 18px; font-weight: bold; color: #16a34a;"></div>
            </div>
            <div>
              <div style="color: #666; font-size: 12px; margin-bottom: 4px;">Mã vận đơn</div>
              <div id="trackCode" style="font-size: 14px; color: #333;"></div>
            </div>
            <div>
              <div style="color: #666; font-size: 12px; margin-bottom: 4px;">Dự kiến giao</div>
              <div id="trackDelivery" style="font-size: 14px; color: #333;"></div>
            </div>
          </div>
        </div>

        <!-- Timeline -->
        <div style="margin-bottom: 24px;">
          <h2 style="margin-bottom: 20px; font-size: 18px; color: #333;">Lộ trình giao hàng</h2>
          <div class="track-timeline" id="trackTimeline"></div>
        </div>

        <!-- History -->
        <div id="trackHistoryContainer" style="display: none;">
          <h2 style="margin-bottom: 16px; font-size: 18px; color: #333;">Chi tiết cập nhật</h2>
          <div id="trackHistory" style="background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px;"></div>
        </div>
      </div>

      <!-- Empty State -->
      <div id="emptyState" style="text-align: center; padding: 48px; color: #999;">
        <div style="font-size: 48px; margin-bottom: 16px;">📍</div>
        <div style="font-size: 18px; margin-bottom: 8px;">Chưa có thông tin</div>
        <div style="font-size: 14px;">Nhập mã đơn hàng để bắt đầu theo dõi</div>
      </div>
    </div>
  </div>

  <script src="../shared/header.js"></script>
  <script src="../shared/frontend-env.js"></script>
  <script src="track.js"></script>
</body>
</html>
