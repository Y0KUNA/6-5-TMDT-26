<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Shipper Login</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>.login-box{max-width:420px;margin:40px auto;padding:24px;background:#fff;border:1px solid #eee;border-radius:8px;} .form-row{margin-bottom:12px;}</style>
</head>
<body>
  <div id="siteHeader"></div>
  <div class="login-box">
    <h2>Đăng nhập Shipper</h2>
    <p>Đăng nhập thực tế bằng email/password hoặc sử dụng demo shipper id.</p>
    <div class="form-row">
      <label class="form-label">Email</label>
      <input id="email" class="form-input" placeholder="email@domain.tld" />
    </div>
    <div class="form-row">
      <label class="form-label">Mật khẩu</label>
      <input id="password" type="password" class="form-input" placeholder="Mật khẩu" />
    </div>
    <div style="display:flex; gap:8px; margin-bottom:12px;">
      <button id="authLoginBtn" class="btn btn-primary">Đăng nhập bằng tài khoản</button>
      <button id="toRegister" class="btn btn-secondary">Đăng ký</button>
    </div>

    <hr />
    <h3>Hoặc demo shipper</h3>
    <div class="form-row">
      <label class="form-label">Shipper ID (demo)</label>
      <input id="shipperId" class="form-input" placeholder="Nhập shipper id (ví dụ 1)" />
    </div>
    <div class="form-row">
      <label class="form-label">Tên hiển thị (tùy chọn)</label>
      <input id="displayName" class="form-input" placeholder="Tên hiển thị (tùy chọn)" />
    </div>
    <div style="display:flex; gap:8px;">
      <button id="demoBtn" class="btn btn-outline-success">Đăng nhập demo</button>
      <button id="skipBtn" class="btn btn-secondary">Bỏ qua (guest)</button>
    </div>
  </div>

  <script src="../shared/frontend-env.js"></script>
  <script src="shipper-login.js"></script>
</body>
</html>
