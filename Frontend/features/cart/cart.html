<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gio Hang - Nong San Sach</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .cart-empty-state {
      display: none;
      min-height: 380px;
      padding: 72px 24px;
      text-align: center;
      background: #F7F7F7;
      border-top: 1px solid #E5E7EB;
    }

    .cart-empty-illustration {
      position: relative;
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #C8DD50;
    }

    .cart-empty-illustration::before {
      content: "";
      position: absolute;
      left: 27px;
      top: 24px;
      width: 42px;
      height: 44px;
      background: #FFE08A;
      border-radius: 0 0 8px 8px;
      box-shadow: inset 0 7px 0 rgba(173, 132, 45, 0.22);
    }

    .cart-empty-illustration::after {
      content: "";
      position: absolute;
      left: 40px;
      top: 45px;
      width: 20px;
      height: 12px;
      border: 2px solid #A97522;
      border-top: 0;
      border-radius: 0 0 20px 20px;
    }

    .cart-empty-note {
      position: absolute;
      right: 16px;
      bottom: 18px;
      width: 28px;
      height: 20px;
      border-radius: 3px;
      background: #D9EEF0;
      border: 1px solid #9EC9CE;
      transform: rotate(4deg);
    }

    .cart-empty-text {
      color: #8A8A8A;
      font-size: 14px;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .cart-empty-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 168px;
      height: 40px;
      padding: 0 24px;
      border-radius: 2px;
      background: #EF4B2B;
      color: #FFF;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="siteHeader"></div>
  <div style="min-height: 100vh; background: #FFF;">
    <div class="container" style="padding: 24px 45px;">
      <h1 style="color: #1F2937; font-size: 24px; font-weight: 700; margin-bottom: 32px;">Giỏ Hàng</h1>

      <div id="cartItems">
        <!-- Cart items will be rendered here -->
      </div>

      <div id="emptyCart" class="cart-empty-state">
        <div class="cart-empty-illustration" aria-hidden="true">
          <span class="cart-empty-note"></span>
        </div>
        <div id="emptyCartHeading" class="cart-empty-text">Giỏ hàng của bạn còn trống</div>
        <a href="../home/index.html" class="cart-empty-action">Mua ngay</a>
      </div>

      <div id="cartSummary" style="display: none;">
        <div style="border-radius: 8px; border: 1px solid #E5E7EB; background: #FFF; padding: 24px; margin-top: 32px;">
          <div style="display: flex; justify-content: space-between; margin-bottom: 16px;">
            <span style="color: #1F2937; font-size: 16px; font-weight: 600;">Tổng tiền:</span>
            <span id="totalAmount" style="color: #1F2937; font-size: 16px; font-weight: 600;"></span>
          </div>
          <button onclick="checkout()" class="btn btn-success" style="width: 100%;">Thanh Toán</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/env.js"></script>
  <script src="../../js/data.js"></script>
  <script src="../shared/header.js"></script>
  <script src="./cart.js"></script>
</body>
</html>
