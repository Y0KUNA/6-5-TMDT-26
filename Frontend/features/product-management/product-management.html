<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản Lý Sản Phẩm - Nông Sản Sạch</title>
  <link rel="stylesheet" href="../../css/style.css">
  <style>
    .tab-button-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .tab-button-group button {
      padding: 10px 16px;
      border-radius: 4px;
      border: 1px solid transparent;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
    }
    .tab-button-group button.active {
      background: #16A34A;
      color: #FFF;
      border-color: #16A34A;
    }
    .tab-button-group button:not(.active) {
      background: #FFF;
      color: #16A34A;
      border-color: #16A34A;
    }
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.5);
      animation: fadeIn 0.3s ease;
    }
    .modal.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background-color: #FFF;
      padding: 32px;
      border-radius: 12px;
      max-width: 600px;
      width: 90%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      animation: slideDown 0.3s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideDown {
      from { transform: translateY(-30px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .image-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .image-item {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid #E5E7EB;
      background: #F9FAFB;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .image-item:hover {
      border-color: #16A34A;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2);
    }
    .image-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .image-item .remove-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      background: #EF4444;
      color: white;
      border: none;
      border-radius: 50%;
      width: 28px;
      height: 28px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 16px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }
    .image-item:hover .remove-btn {
      opacity: 1;
    }
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: #6B7280;
    }
    .empty-state-icon {
      font-size: 48px;
      margin-bottom: 16px;
    }
  </style>
</head>
<body style="background: #F3F4F6;">
  <div id="siteHeader"></div>
  <div class="container" style="padding: 24px; max-width: 1400px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px;">
      <h1 style="color: #000; font-size: 28px; font-weight: 700;">Quản Lý Sản Phẩm</h1>
      
      <div class="tab-button-group">
        <button onclick="showTab('stats')" class="btn-tab active" data-tab="stats">📊 Thống Kê</button>
        <button onclick="showTab('list')" class="btn-tab" data-tab="list">📋 Danh Sách</button>
        <a href="product-add.html" class="btn btn-success">➕ Thêm Sản Phẩm</a>
      </div>
    </div>

    <!-- Statistics Tab -->
    <div id="statsTab" style="display: block;">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; margin-bottom: 24px;">
        <div style="background: #FFF; border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <div style="color: #6B7280; font-size: 14px; font-weight: 500; margin-bottom: 8px;">Tổng Sản Phẩm</div>
          <div id="totalProducts" style="color: #16A34A; font-size: 32px; font-weight: 700;">0</div>
        </div>
        <div style="background: #FFF; border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <div style="color: #6B7280; font-size: 14px; font-weight: 500; margin-bottom: 8px;">Tổng Đã Bán</div>
          <div id="totalSold" style="color: #3B82F6; font-size: 32px; font-weight: 700;">0</div>
        </div>
        <div style="background: #FFF; border-radius: 8px; padding: 24px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <div style="color: #6B7280; font-size: 14px; font-weight: 500; margin-bottom: 8px;">Tổng Doanh Thu</div>
          <div id="totalRevenue" style="color: #F59E0B; font-size: 32px; font-weight: 700;">0 VNĐ</div>
        </div>
      </div>
    </div>

    <!-- Product List Tab -->
    <div id="listTab" style="display: none;">
      <div style="border-radius: 8px; background: #FFF; box-shadow: 0 4px 6px rgba(0,0,0,0.1); padding: 24px;">
        <h2 style="color: #000; font-size: 20px; font-weight: 600; padding-bottom: 24px; border-bottom: 1px solid #E5E7EB; margin-bottom: 24px;">
          Danh Sách Sản Phẩm
        </h2>
        
        <div id="emptyState" class="empty-state" style="display: none;">
          <div class="empty-state-icon">📦</div>
          <div style="font-size: 18px; font-weight: 500; color: #374151; margin-bottom: 8px;">Chưa có sản phẩm nào</div>
          <div style="font-size: 14px; margin-bottom: 16px;">Hãy thêm sản phẩm đầu tiên của bạn</div>
          <a href="product-add.html" class="btn btn-success">Thêm Sản Phẩm</a>
        </div>
        
        <table class="table" id="productsTable" style="display: none;">
          <thead>
            <tr style="background: #F9FAFB;">
              <th style="text-align: left;">Sản Phẩm</th>
              <th style="text-align: left;">Giá</th>
              <th style="text-align: left;">Đã Bán</th>
              <th style="text-align: left;">Doanh Thu</th>
              <th style="text-align: left;">Đánh Giá</th>
              <th style="text-align: center;">Thao Tác</th>
            </tr>
          </thead>
          <tbody id="productsList">
            <!-- Products will be loaded here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Edit Product Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2 style="color: #000; font-size: 24px; font-weight: 700; margin-bottom: 24px;">Chỉnh Sửa Sản Phẩm</h2>
      <form id="editForm">
        <div class="form-group">
          <label style="color: #000; font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px;">Tên Sản Phẩm</label>
          <input type="text" id="editName" class="form-input" required>
        </div>
        <div class="form-group">
          <label style="color: #000; font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px;">Mô Tả</label>
          <textarea id="editDescription" class="form-textarea" rows="4" required></textarea>
        </div>
        <div class="form-group">
          <label style="color: #000; font-size: 14px; font-weight: 600; display: block; margin-bottom: 8px;">Giá (VNĐ)</label>
          <input type="number" id="editPrice" class="form-input" required>
        </div>
        <div style="display: flex; gap: 16px; margin-top: 24px;">
          <button type="submit" class="btn btn-success" style="flex: 1;">Cập Nhật</button>
          <button type="button" onclick="closeEditModal()" class="btn btn-secondary" style="flex: 1;">Hủy</button>
        </div>
      </form>
    </div>
  </div>

  <script src="../../js/data.js"></script>
  <script src="../../js/data-business.js"></script>
  <script src="../shared/header.js"></script>
  <script src="./product-management.js"></script>
</body>
</html>
